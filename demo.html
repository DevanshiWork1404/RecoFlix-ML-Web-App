<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Movie Recommender</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      background: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)), url(back.jpg);
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      font-family: Arial, sans-serif;
      color: #fff;
      padding: 40px 20px;
    }

    .container {
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
    }

    h1 { color: white; margin-bottom: 20px; font-size: 32px; }

    input {
      padding: 12px;
      font-size: 16px;
      width: 100%;
      border: none;
      border-radius: 4px;
      margin-bottom: 10px;
    }

    button {
      padding: 12px;
      font-size: 16px;
      width: 100%;
      background: #e50914;
      color: white;
      border: none;
      cursor: pointer;
      border-radius: 4px;
    }

    button:hover { background: #b20710; }

    #error { color: #ff6b6b; margin-top: 10px; }

    #results { margin-top: 15px; }

    .movie-card {
      background: rgba(0, 0, 0, 0.8);
      border: 1px solid #e50914;
      padding: 12px 16px;
      margin: 8px 0;
      border-radius: 6px;
      font-size: 16px;
      color: #fff;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Find Your Next Favorite Movie 🎥</h1>
    <input id="movieInput" type="text" placeholder="Enter a movie name (e.g. Avatar)" list="movieList" />
    <datalist id="movieList"></datalist>
    <button onclick="getRecommendations()">Recommend</button>
    <p id="error"></p>
    <div id="results"></div>
  </div>

  <script>
    fetch("http://localhost:5000/movies")
      .then(res => res.json())
      .then(data => {
        const datalist = document.getElementById("movieList");
        data.movies.forEach(movie => {
          const option = document.createElement("option");
          option.value = movie;
          datalist.appendChild(option);
        });
      });

    async function getRecommendations() {
      const movie = document.getElementById("movieInput").value.trim();
      const errorEl = document.getElementById("error");
      const resultsEl = document.getElementById("results");

      errorEl.innerText = "";
      resultsEl.innerHTML = "<p>Loading...</p>";

      const response = await fetch("http://localhost:5000/recommend", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ movie })
      });

      if (!response.ok) {
        errorEl.innerText = "Movie not found. Try another title.";
        resultsEl.innerHTML = "";
        return;
      }

      const data = await response.json();
      resultsEl.innerHTML = data.recommendations
        .map((m, i) => `<div class="movie-card">🎥 ${i + 1}. ${m}</div>`)
        .join("");

      // Auto scroll to results
      resultsEl.scrollIntoView({ behavior: "smooth" });
    }
  </script>
</body>
</html>
